<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,, initial-scale=1.0">
    <title>tables</title>
    <style>
        tr:nth-child(2){
         background-color: rgb(113, 52, 7);
        }
        ul:nth-child(1){
            background-color: blue;
        }
    </style>
</head>
<body>
    <!--my praca-->
    <table border="1">
        <tr>
            <th>name</th>
            <th>age</th>
            <th>gender</th>
        </tr>
        <tr>
    
            <td>sam</td>
            <td>23</td>
            <td>male</td>
        </tr>

    </table>
<h2>merge</h2>

        </tr>
        <tr>
            <td>22</td>

     </tr>
    </table>
