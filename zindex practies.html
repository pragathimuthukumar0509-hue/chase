<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1{
            width: 150px;
            height: 150px;
            position: absolute;
            left: 50px;
            top: 450px;
        }
        .box2{
            width: 150px;
            height: 150px;
            position: absolute;
            left: 100px;
            top: 100px;
        }
        .box3{
            width: 150px;
            height: 150px;
            position: relative;
            right: 120px;
            top: 200px;
        }
        .box4{
            width: 150px;
            height: 150px;
            position: absolute;
            left: 70px;
            bottom: 250px;
        }
        
        
    </style>
</head>
<body>
    <div class="box1"><img src="house.jpg"></div>
    <div class="box2"><img src="flower.jpg"></div>
    <div class="box3"><img src="dog.jpg"></div>
    <div class="box4"><img src="cat.jpg"></div>
   
</body>
</html>
